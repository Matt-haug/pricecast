[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricecast"
version = "0.1.0"
description = "Synthetic hourly electricity price years for prospective energy system studies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Matteo Hauglustaine", email = "matteo@abeo.be" },
    { name = "Ward De Paepe" },
    { name = "Francesco Contino" },
]
keywords = [
    "electricity",
    "day-ahead price",
    "price profile",
    "synthetic data",
    "energy system modelling",
    "techno-economic analysis",
    "duck curve",
    "time series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
entsoe = ["entsoe-py>=0.6"]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]
dev = ["pricecast[entsoe,plot,test,docs]"]

[project.urls]
Homepage = "https://github.com/Matt-haug/pricecast"
Repository = "https://github.com/Matt-haug/pricecast"
Issues = "https://github.com/Matt-haug/pricecast/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pricecast = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
